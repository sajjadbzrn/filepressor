name: Bug Report
description: Report a reproducible problem with FilePressor
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill this out so we can
        reproduce and fix it quickly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I drag a .zip into the Extract tab and click Extract, the app freezes…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open the Compress tab
        2. Add a folder with 500+ files
        3. Choose 7Z / Maximum
        4. Click Compress
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux (AppImage)
        - Linux (Debian/Ubuntu .deb)
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FilePressor version
      description: Find this in the About window (e.g. v0.1.0).
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste any relevant console output or error messages.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and this hasn't been reported.
          required: true
