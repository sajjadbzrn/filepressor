name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Never run two releases for the same ref at once. This also serializes the
# matrix builds so they can't race to create the GitHub release (which would
# otherwise produce two releases — one for the tag push and one from the second
# runner trying to publish in parallel).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pre-create the GitHub release ONCE so the per-OS matrix jobs only upload
  # assets to it instead of each trying to create their own release.
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          # Use the pushed tag, or (on manual dispatch) the short commit sha.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "FilePressor ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true

  release:
    name: Build & publish (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: bun install

      # Builds signed bundles (NSIS + MSI on Windows, AppImage + .deb on Linux),
      # generates latest.json, and uploads the artifacts to the release created
      # above (releaseId) — so we always end up with exactly ONE release.
      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # Pin bundles per OS. On Linux we deliberately skip `rpm`, which needs
          # `rpmbuild` (not present on ubuntu-latest) and would otherwise fail
          # the whole Linux build.
          args: >-
            ${{
              matrix.platform == 'windows-latest'
              && '--bundles nsis,msi'
              || '--bundles deb,appimage'
            }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: "FilePressor ${{ needs.create-release.outputs.tag }}"
          releaseBody: |
            ## 🎉 FilePressor ${{ needs.create-release.outputs.tag }}

            **A blazing-fast desktop file compressor built with Tauri 2, Vue 3 & Rust.**

            ### ✨ What's New
            - **Compress anything** — files, folders, or directory trees into ZIP, 7Z (LZMA2), TAR.GZ, TAR.ZST, and more
            - **Re-compress archives** — drop an existing archive and FilePressor rebuilds it in your chosen format
            - **Extract anything** — opens ZIP, 7Z, RAR, TAR, GZ, BZ2, XZ, ZST and more (matched by extension *or* magic bytes)
            - **Media transcoding** — re-encode video to H.265 (HEVC) and images to AVIF for maximum compression
            - **Live progress** with per-file granularity, pause/resume, and cancel at any time
            - **Beautiful UI** with light & dark themes and custom title bar
            - **Automatic updates** — self-updating with ed25519 signature verification

            ### 📦 Downloads
            | Platform | Installer |
            |----------|-----------|
            | Windows  | `FilePressor_*_x64-setup.exe` (NSIS) / `.msi` |
            | Ubuntu   | `FilePressor_*_amd64.AppImage` / `.deb` |

            ### 🔒 Security
            All update artifacts are signed with ed25519 keys. The public key is baked into the app — updates cannot be tampered with in transit.

            **Full changelog:** see the [commit history](https://github.com/sajjadbzrn/filepressor/commits/${{ needs.create-release.outputs.tag }}).
          releaseDraft: false
          prerelease: false
          includeUpdater: true

      # If the build fails, upload the Rust/Cargo logs so the failure is
      # diagnosable from the Actions run instead of silently producing a
      # release with only the auto-generated source archives.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.log
            ~/.cargo/registry/**/*.log
          if-no-files-found: ignore
          retention-days: 7
